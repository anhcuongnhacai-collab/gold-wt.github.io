<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giới thiệu</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    font-family: Arial;
    background:#fff7f0;
}

.marquee {
  white-space: nowrap;
  overflow: hidden;
  background: #ff7a00;
  color: white;
  padding: 8px 0;
  font-size: 13px;
}

.marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll 12s linear infinite;
}

@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="max-w-md mx-auto min-h-screen bg-white pb-24">

<!-- HEADER -->
<div class="bg-orange-500 text-white p-4 text-center font-bold text-lg">
    GIỚI THIỆU NGƯỜI DÙNG
</div>

<!-- MARQUEE -->
<div class="marquee">
  <span>
    Mỗi người được mời khi tham gia đầu tư gói bất kỳ bạn sẽ nhận 25.000₫ + 30% hoa hồng từ gói VIP họ mua ⭐
  </span>
</div>

<!-- USER INFO -->
<div class="p-4 text-center">

    <div class="w-20 h-20 rounded-full overflow-hidden mx-auto">
    <img 
        src="images/logo.png" 
        alt="Avatar"
        class="w-full h-full object-cover"
    >
</div>

    <div class="mt-2 font-bold" id="phone">User</div>
    <div class="text-xs text-gray-500">ID giới thiệu</div>

</div>

<!-- REF LINK -->
<div class="p-4">

    <div class="bg-orange-50 p-3 rounded-xl">
        <div class="text-sm font-bold mb-2">Link giới thiệu của bạn</div>
        <input id="refLink" class="w-full p-2 border rounded text-xs" readonly>
        <button onclick="copyLink()" class="mt-2 w-full bg-orange-500 text-white py-2 rounded">
            Sao chép link
        </button>
    </div>

</div>

<!-- STATS VIP -->
<div class="p-4">

<h2 class="font-bold mb-3">Thống kê hoa hồng VIP</h2>

<div id="vipStats" class="space-y-2"></div>

</div>

</div>

<!-- NAV BAR -->
<!-- NAV BAR -->
<div class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-white border-t flex justify-around p-2 text-xs">

  <button class="flex flex-col items-center text-gray-400" onclick="goHome()">
    <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span class="text-[10px]">Trang chủ</span>
  </button>

  <button class="flex flex-col items-center text-gray-400" onclick="goHoSo()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <span class="text-[10px]">Hồ sơ</span>
  </button>

  <!-- 🔥 GIỚI THIỆU (ĐANG ACTIVE) -->
  <button class="flex flex-col items-center text-black font-bold" onclick="goIntro()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    <span class="text-[10px]">Giới thiệu</span>
  </button>

  <button class="flex flex-col items-center text-gray-400" onclick="goCuaToi()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px]">Của tôi</span>
  </button>

</div>

<script>

let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser){
    window.location.href = "index.html";
}

/* USER */
document.getElementById("phone").innerText = "+84 " + currentUser.phone;

/* REF LINK */
let refLink = window.location.origin + "/register.html?ref=" + currentUser.phone;
document.getElementById("refLink").value = refLink;

function copyLink(){
    navigator.clipboard.writeText(refLink);
    alert("Đã copy link!");
}

/* =========================
   VIP STATS (CÓ VIP 0)
========================= */
function loadStats(){

let vipHistory = JSON.parse(localStorage.getItem("vipHistory")) || [];
let users = JSON.parse(localStorage.getItem("users")) || [];

let myPhone = currentUser.phone;

let container = document.getElementById("vipStats");
container.innerHTML = "";

/* ================= VIP 0 ================= */
let f0 = users.filter(u => u.refBy === myPhone && (!u.vip || u.vip === 0));

container.innerHTML += `
<div class="bg-gray-100 p-3 rounded-xl">
    <div class="font-bold">VIP 0 (Chưa mua VIP)</div>
    <div class="text-xs text-gray-600">Người đăng ký: ${f0.length}</div>
</div>
`;

/* ================= VIP 1 - 10 ================= */
for(let i=1;i<=10;i++){

    let vipName = "GOLD WT-VIP " + i;

    let list = vipHistory.filter(v =>
        v.refBy == myPhone && v.name.includes(vipName)
    );

    let count = list.length;

    let commission = list.reduce((sum,v)=>{
        return sum + (v.price * 0.30);
    },0);

    container.innerHTML += `
    <div class="bg-orange-50 p-3 rounded-xl">
        <div class="font-bold">${vipName}</div>
        <div class="text-xs text-gray-600">Người mua: ${count}</div>
        <div class="text-xs text-green-600">Hoa hồng: ${commission.toLocaleString("vi-VN")}₫</div>
    </div>
    `;
}

}

loadStats();

/* NAV */
function goHome(){ window.location.href="home.html"; }
function goHoSo(){ window.location.href="hoso.html"; }
function goIntro(){ window.location.href="intro.html"; }
function goCuaToi(){ window.location.href="cuatoi.html"; }

</script>

</body>
</html>
