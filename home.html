<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm - Gói VIP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center">

<div class="w-full max-w-md bg-gray-50 h-full flex flex-col relative shadow-xl overflow-hidden">

<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-10">
  <div class="w-full flex justify-center items-center py-3">
    <img src="images/logohome.jpg" class="h-16 object-contain mx-auto cursor-pointer px-4" id="logoHome">
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 overflow-y-auto pb-20">
<div class="px-4 py-4 space-y-4">

<!-- STATUS -->
<div class="bg-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
  <div class="relative w-16 h-16">
    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
      <path class="text-gray-200" stroke-width="4" stroke="currentColor" fill="none"
        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
    </svg>
    <div class="absolute inset-0 flex items-center justify-center flex-col">
      <span class="text-[10px] font-bold" id="balance">₫0</span>
      <span class="text-[8px] text-gray-500">Số dư</span>
    </div>
  </div>

  <div class="flex flex-col gap-2 flex-1 ml-6">
    <button id="btnDeposit" class="flex justify-between items-center bg-green-100 rounded-lg px-3 py-2">
      <span class="text-xs font-semibold text-green-600">Nạp tiền</span>
      <span class="text-xs bg-green-500 text-white px-3 py-1 rounded-full">+</span>
    </button>
    <button id="btnWithdraw" class="flex justify-between items-center bg-red-100 rounded-lg px-3 py-2">
      <span class="text-xs font-semibold text-red-600">Rút tiền</span>
      <span class="text-xs bg-red-500 text-white px-3 py-1 rounded-full">-</span>
    </button>
  </div>
</div>
</div>

<!-- PRODUCTS -->
<div class="px-4 pb-6">
  <h2 class="text-lg font-bold mb-4">Sản phẩm</h2>
  <div class="space-y-3" id="vip-packages-container"></div>
</div>
</main>

<!-- NAVBAR -->
<nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-around py-2">
  <button class="flex flex-col items-center text-black" id="navHome">
    <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="text-[10px] font-semibold">Trang chủ</span>
  </button>
  <button class="flex flex-col items-center text-gray-400" id="navHoSo">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <span class="text-[10px]">Hồ sơ</span>
  </button>
  <button class="flex flex-col items-center text-gray-400" id="navIntro">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    <span class="text-[10px]">Giới thiệu</span>
  </button>
  <button class="flex flex-col items-center text-gray-400" id="navCuaToi">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px]">Của tôi</span>
  </button>
</nav>

</div>

<script type="module">
import { db, ref, onValue, push, set } from "./firebase-config.js";

// ====== USER ======
let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser) window.location.href="index.html";

// ====== VIP PACKAGES ======
const vipPackages = [
{ id:1,name:"GOLD WT-VIP 1",rate:17,duration:80,daily:"8.500",total:"680.000",price:"50.000"},
{ id:2,name:"GOLD WT-VIP 2",rate:17,duration:80,daily:"17.000",total:"1.360.000",price:"100.000"},
{ id:3,name:"GOLD WT-VIP 3",rate:17,duration:80,daily:"34.000",total:"2.720.000",price:"200.000"},
{ id:4,name:"GOLD WT-VIP 4",rate:17,duration:80,daily:"85.000",total:"6.800.000",price:"500.000"},
{ id:5,name:"GOLD WT-VIP 5",rate:17,duration:80,daily:"136.000",total:"10.880.000",price:"800.000"},
{ id:6,name:"GOLD WT-VIP 6",rate:17,duration:80,daily:"255.000",total:"20.400.000",price:"1.500.000"},
{ id:7,name:"GOLD WT-VIP 7",rate:17,duration:80,daily:"510.000",total:"40.800.000",price:"3.000.000"},
{ id:8,name:"GOLD WT-VIP 8",rate:17,duration:80,daily:"680.000",total:"54.400.000",price:"4.000.000"},
{ id:9,name:"GOLD WT-VIP 9",rate:17,duration:80,daily:"850.000",total:"68.000.000",price:"5.000.000"},
{ id:10,name:"GOLD WT-VIP 10",rate:17,duration:80,daily:"1.020.000",total:"81.600.000",price:"6.000.000"}
];

const container = document.getElementById("vip-packages-container");

// RENDER VIP
vipPackages.forEach(pkg=>{
const imageUrl="https://cdn.phototourl.com/free/2026-05-10-6aa5462c-adeb-4d28-88a4-faad3c335cb4.jpg";
container.insertAdjacentHTML("beforeend",`
<div class="bg-white rounded-xl p-3 shadow-sm flex gap-3">
<div class="w-24 h-24 rounded-lg overflow-hidden">
<img src="${imageUrl}" class="w-full h-full object-cover">
</div>
<div class="flex-1">
<h3 class="text-xs font-bold mb-1">${pkg.name}</h3>
<div class="text-[10px] text-gray-500 space-y-1">
<div class="flex justify-between"><span>Lợi nhuận/ngày</span><span>${pkg.rate}%</span></div>
<div class="flex justify-between"><span>Chu kỳ</span><span>${pkg.duration} ngày</span></div>
<div class="flex justify-between"><span>Ngày</span><span>${pkg.daily} ₫</span></div>
<div class="flex justify-between"><span>Tổng</span><span>${pkg.total} ₫</span></div>
</div>
<div class="flex justify-between items-center mt-2">
<span class="text-orange-500 font-bold text-sm">${pkg.price} ₫</span>
<button class="buy-btn bg-orange-500 text-white text-[10px] px-3 py-1 rounded-full"
data-name="${pkg.name}" data-price="${pkg.price}">Mua ngay</button>
</div>
</div>
</div>
`);
});

// ====== ĐỒNG BỘ SỐ DƯ ======
let totalDeposit=0, totalWithdrawSuccess=0, totalWithdrawPending=0;
const userRef = ref(db, "users/" + currentUser.phone);

// Lắng nghe user từ Firebase
onValue(userRef, snap => {
  const userData = snap.val();
  if(userData){
    currentUser.baseMoney = Number(userData.baseMoney || 10000);
  }
  updateBalanceUI();
});

function updateBalanceUI(){
  const available = (currentUser.baseMoney||10000) + totalDeposit - totalWithdrawSuccess - totalWithdrawPending;
  document.getElementById("balance").innerText = "₫"+Number(available).toLocaleString("vi-VN");
}

// Lắng nghe deposits
onValue(ref(db,"deposits"),snap=>{
  totalDeposit=0;
  snap.forEach(d=>{
    const v=d.val();
    if(v.phone===currentUser.phone && v.status==="Thành công") totalDeposit+=Number(v.amount);
  });
  updateBalanceUI();
});

// Lắng nghe withdraws
onValue(ref(db,"withdraws"),snap=>{
  totalWithdrawSuccess=0; totalWithdrawPending=0;
  snap.forEach(w=>{
    const v=w.val();
    if(v.phone===currentUser.phone){
      if(v.status==="Thành công") totalWithdrawSuccess+=Number(v.amount);
      else if(v.status==="pending") totalWithdrawPending+=Number(v.amount);
    }
  });
  updateBalanceUI();
});

// ====== MUA VIP ======
document.addEventListener("click", e => {
  if(e.target.classList.contains("buy-btn")){
    let name = e.target.dataset.name;
    let price = Number(e.target.dataset.price.replace(/\./g,""));
    const available = (currentUser.baseMoney||10000) + totalDeposit - totalWithdrawSuccess - totalWithdrawPending;

    if(price > available){
      alert("Số dư không đủ!");
      return;
    }

    // Lưu VIP vào Firebase
 document.addEventListener("click", e => {
  if(e.target.classList.contains("buy-btn")){
    let name = e.target.dataset.name;
    let price = Number(e.target.dataset.price.replace(/\./g,""));
    const available = currentUser.baseMoney || 10000;

    if(price > available){
      alert("Số dư không đủ!");
      return;
    }

    // Trừ tiền trước khi push VIP
    const newBalance = currentUser.baseMoney - price;

    // Trừ tiền + push VIP chỉ khi push VIP thành công
    push(ref(db, "vip-purchases"), {
      phone: currentUser.phone,
      packageName: name,
      price: price,
      timestamp: Date.now()
    }).then(() => {
      // Cập nhật baseMoney trên Firebase
      set(userRef, {
        ...currentUser,
        baseMoney: newBalance
      }).then(()=>{
        currentUser.baseMoney = newBalance;
        updateBalanceUI();
        alert("Mua thành công " + name);
      }).catch(err=>{
        console.error(err);
        alert("Lỗi khi cập nhật số dư!");
      });
    }).catch(err=>{
      console.error(err);
      alert("Lỗi khi lưu gói VIP!");
    });
  }
});
  }
});

// ====== NAVIGATION ======
document.getElementById("logoHome").onclick = ()=>goHome();
document.getElementById("btnDeposit").onclick = ()=>goDeposit();
document.getElementById("btnWithdraw").onclick = ()=>goWithdraw();
document.getElementById("navHome").onclick = ()=>goHome();
document.getElementById("navHoSo").onclick = ()=>goHoSo();
document.getElementById("navIntro").onclick = ()=>goIntro();
document.getElementById("navCuaToi").onclick = ()=>goCuaToi();

function goHome(){ window.location.href="home.html"; }
function goHoSo(){ window.location.href="hoso.html"; }
function goIntro(){ window.location.href="intro.html"; }
function goCuaToi(){ window.location.href="cuatoi.html"; }
function goDeposit(){ window.location.href="deposit.html"; }
function goWithdraw(){ window.location.href="withdraw.html"; }

</script>

</body>
</html>
