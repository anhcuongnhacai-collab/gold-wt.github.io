<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
}

.box{
    margin-top:100px;
    background:white;
    padding:25px;
    border-radius:16px;
    width:320px;
    text-align:center;
}

h2{ color:#ff7a00; }

.amount{
    font-size:28px;
    margin:15px 0;
    font-weight:bold;
}

.btn{
    background:linear-gradient(to right,#ff7a00,#ffb347);
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">
<h2>Thanh toán đơn</h2>

<div id="method"></div>
<div class="amount" id="amount"></div>

<button class="btn" onclick="pay()">Xác nhận thanh toán</button>
</div>

<script>

let params = new URLSearchParams(location.search);

let method = params.get("method");
let amount = Number(params.get("amount"));

document.getElementById("amount").innerText =
"₫" + amount.toLocaleString("vi-VN");

document.getElementById("method").innerText =
"Phương thức: " + (method == "qr" ? "QR Code" : "MoMo");

function pay(){

    let user = JSON.parse(localStorage.getItem("currentUser"));

    if(!user){
        alert("Chưa đăng nhập");
        return;
    }

    let money = Number(localStorage.getItem("money")) || 0;
    money += amount;

    localStorage.setItem("money", money);

    // HISTORY
    let history = JSON.parse(localStorage.getItem("history_" + user.phone)) || [];

    history.push({
        type:"nạp",
        amount:amount,
        method:method,
        time:new Date().toLocaleString()
    });

    localStorage.setItem("history_" + user.phone, JSON.stringify(history));

    alert("Nạp tiền thành công");

    window.location.href = "home.html";
}

</script>

</body>
</html>
