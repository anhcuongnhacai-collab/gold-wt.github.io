<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Của tôi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body{ background:#f3f3f3; display:flex; justify-content:center; }
.container{ width:100%; max-width:420px; min-height:100vh; background:#f3f3f3; padding:20px 16px 100px; position:relative; }
/* HEADER */
.title{ text-align:center; font-size:30px; font-weight:bold; margin-top:10px; }
.top-icon{ position:absolute; right:20px; top:25px; font-size:22px; cursor:pointer; }
/* PROFILE */
.profile{ text-align:center; margin-top:20px; }
.avatar{ width:85px; height:85px; border-radius:50%; background:#6bc1ff; margin:auto; display:flex; justify-content:center; align-items:center; }
.avatar i{ font-size:45px; color:white; }
.user-id{ margin-top:10px; color:#777; font-size:14px; }
/* BALANCE */
.balance-box{ display:flex; gap:10px; margin-top:20px; }
.balance-item{ flex:1; background:#eee; padding:14px; border-radius:12px; }
.money{ font-size:18px; font-weight:bold; }
.label{ font-size:12px; color:#666; }
/* MENU */
.menu{ margin-top:25px; display:flex; flex-direction:column; gap:12px; }
.menu-item{ background:white; padding:15px; border-radius:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.left{ display:flex; align-items:center; gap:12px; }
.icon{ width:40px; height:40px; background:#ff8a2a; border-radius:50%; display:flex; justify-content:center; align-items:center; color:white; }
.text{ font-weight:600; }
.arrow{ color:#ff8a2a; }
/* NAV BAR */
.bottom-nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; background:white; border-top:1px solid #ddd; display:flex; justify-content:space-around; padding:8px 0; }
.nav-item{ display:flex; flex-direction:column; align-items:center; font-size:12px; color:#999; }
.nav-item svg{ width:24px; height:24px; margin-bottom:3px; }
.nav-item.active{ color:black; font-weight:bold; }
</style>
</head>
<body>
<div class="container">

<div class="title">Của tôi</div>

<!-- Tai nghe -->
<div class="top-icon" onclick="goSupport()"><i class="fa-solid fa-headphones"></i></div>

<!-- PROFILE -->
<div class="profile">
<div class="avatar">
<img src="images/logo.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
</div>
<div class="user-id" id="userPhone"></div>
<div class="balance-box">
<div class="balance-item">
<div class="money" id="balance">₫0</div>
<div class="label">Số dư</div>
</div>
<div class="balance-item">
<div class="money" id="withdraw">₫0</div>
<div class="label">Có thể rút</div>
</div>
</div>
</div>

<!-- MENU -->
<div class="menu">
<div class="menu-item" onclick="goWithdraw()"><div class="left"><div class="icon"><i class="fa-solid fa-arrow-up"></i></div><div class="text">Rút tiền</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" onclick="goDeposit()"><div class="left"><div class="icon"><i class="fa-solid fa-wallet"></i></div><div class="text">Nạp tiền</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" onclick="goBank()"><div class="left"><div class="icon"><i class="fa-solid fa-credit-card"></i></div><div class="text">Ngân hàng</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" onclick="goSupport()"><div class="left"><div class="icon"><i class="fa-solid fa-headset"></i></div><div class="text">Hỗ trợ</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" onclick="goGroup()"><div class="left"><div class="icon"><i class="fa-brands fa-telegram"></i></div><div class="text">Nhóm chính thức</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" onclick="goHistory()"><div class="left"><div class="icon"><i class="fa-solid fa-clock-rotate-left"></i></div><div class="text">Lịch sử giao dịch</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
<div class="menu-item" id="logoutBtn"><div class="left"><div class="icon"><i class="fa-solid fa-power-off"></i></div><div class="text">Đăng xuất</div></div><div class="arrow"><i class="fa-solid fa-angle-right"></i></div></div>
</div>
</div>

<!-- NAV BAR -->
<div class="bottom-nav">
<div class="nav-item" onclick="goHome()"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Trang chủ</span></div>
<div class="nav-item" onclick="goProfilePage()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Hồ sơ</span></div>
<div class="nav-item" onclick="goIntro()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><span>Giới thiệu</span></div>
<div class="nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Của tôi</span></div>
</div>

<script type="module">
import { db, ref, onValue } from "./firebase-config.js";

let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser) window.location.href = "index.html";

// default 10k nếu user mới
if(!currentUser.money) currentUser.money = 10000;

document.getElementById("userPhone").innerText = "+84 "+currentUser.phone;

function goHome(){ window.location.href="home.html"; }
function goProfilePage(){ window.location.href="hoso.html"; }
function goIntro(){ window.location.href="intro.html"; }
function goWithdraw(){ window.location.href="withdraw.html"; }
function goDeposit(){ window.location.href="deposit.html"; }
function goBank(){ window.location.href="bank.html"; }
function goSupport(){ window.location.href="support.html"; } // tai nghe
function goGroup(){ window.open("https://t.me/GOLDWT1","_blank"); }
function goHistory(){ window.location.href="history.html"; }
function logout(){
    localStorage.removeItem("currentUser");
    window.location.href="index.html";
}

// Gán tất cả hàm ra window để onclick inline hoạt động
window.goHome = goHome;
window.goProfilePage = goProfilePage;
window.goIntro = goIntro;
window.goWithdraw = goWithdraw;
window.goDeposit = goDeposit;
window.goBank = goBank;
window.goSupport = goSupport;
window.goGroup = goGroup;
window.goHistory = goHistory;
window.logout = logout;
document.getElementById("logoutBtn").onclick = logout;

// Hàm cập nhật số dư
function updateBalanceUI(amount){
    document.getElementById("balance").innerText = "₫"+Number(amount).toLocaleString("vi-VN");
    document.getElementById("withdraw").innerText = "₫"+Number(amount).toLocaleString("vi-VN");
}

// Đồng bộ số dư với admin Firebase
let totalDeposit = 0;
let totalWithdraw = 0;

// Lắng nghe nạp tiền
onValue(ref(db,"deposits"), snapDep=>{
    totalDeposit = 0;
    snapDep.forEach(d=>{
        let v = d.val();
        if(v.phone === currentUser.phone && v.status === "Thành công") totalDeposit += Number(v.amount);
    });
    updateBalance();
});

// Lắng nghe rút tiền
onValue(ref(db,"withdraws"), snapW=>{
    totalWithdraw = 0;
    snapW.forEach(w=>{
        let v = w.val();
        if(v.phone === currentUser.phone && v.status === "Thành công") totalWithdraw += Number(v.amount);
    });
    updateBalance();
});

// Cập nhật số dư
function updateBalance(){
    let balance = (currentUser.money||0) + totalDeposit - totalWithdraw;
    updateBalanceUI(balance);
    currentUser.money = balance;
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
}

</script>

</body>
</html>
