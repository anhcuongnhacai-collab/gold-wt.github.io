<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ của tôi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>
</head>
<body class="h-screen flex justify-center">

<div class="w-full max-w-md bg-gray-50 h-full flex flex-col relative">

<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-10">
  <div class="py-3 text-center font-bold text-lg">Hồ sơ của tôi</div>
</header>

<!-- MAIN -->
<main class="flex-1 overflow-y-auto pb-20 p-4 space-y-4">

<!-- BALANCE -->
<div class="bg-white rounded-2xl p-4 shadow">
  <div class="text-gray-500 text-sm">Tổng số dư</div>
  <div class="text-xl font-bold text-orange-500" id="balance2">0₫</div>
</div>

<!-- SUMMARY -->
<div class="grid grid-cols-2 gap-3">
  <div class="bg-white p-3 rounded-xl shadow">
    <div class="text-xs text-gray-500">Tổng vốn đã mua</div>
    <div class="font-bold" id="totalInvest">0₫</div>
  </div>
  <div class="bg-white p-3 rounded-xl shadow">
    <div class="text-xs text-gray-500">Có thể rút</div>
    <div class="font-bold text-blue-500" id="withdrawable">0₫</div>
  </div>
</div>

<div class="bg-white p-3 rounded-xl shadow">
  <div class="text-xs text-gray-500">Tổng lợi nhuận 80 ngày</div>
  <div class="font-bold text-green-600" id="totalProfit">0₫</div>
</div>

<!-- VIP LIST -->
<div class="space-y-3">
  <h2 class="font-bold">Gói VIP đã mua</h2>
  <div id="list"></div>
</div>

</main>

<!-- NAV -->
<nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-around py-2">
  <button class="flex flex-col items-center text-gray-400" onclick="goHome()">
    <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="text-[10px]">Trang chủ</span>
  </button>
  <button class="flex flex-col items-center text-black" onclick="goHoSo()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <span class="text-[10px] font-semibold">Hồ sơ</span>
  </button>
  <button class="flex flex-col items-center text-gray-400" onclick="goIntro()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    <span class="text-[10px]">Giới thiệu</span>
  </button>
  <button class="flex flex-col items-center text-gray-400" onclick="goCuaToi()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px]">Của tôi</span>
  </button>
</nav>

</div>

<script type="module">
import { db, ref, onValue } from "./firebase-config.js";

let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser) window.location.href="index.html";

let balanceEl = document.getElementById("balance2");
let totalInvestEl = document.getElementById("totalInvest");
let withdrawableEl = document.getElementById("withdrawable");
let totalProfitEl = document.getElementById("totalProfit");
let vipListEl = document.getElementById("list");

const userRef = ref(db, `users/${currentUser.phone}`);
let userMoney = 10000;

// ====== LẮNG NGHE SỐ DƯ ======
onValue(userRef, snap=>{
  const u = snap.val();
  if(u && u.money!==undefined) userMoney = u.money;
  balanceEl.innerText = userMoney.toLocaleString("vi-VN")+"₫";
});

// ====== LẤY VIP HISTORY ======
const vipHistoryRef = ref(db, 'vipHistory');
let vipHistory = [];

function renderVIP(){
  vipListEl.innerHTML = '';
  let totalInvest = 0, totalProfit = 0, withdrawable = 0;
  const myVIP = vipHistory.filter(v=>v.phone===currentUser.phone);
  if(myVIP.length===0){
    vipListEl.innerHTML = '<div class="text-gray-400 text-sm">Chưa có gói VIP</div>';
  }
  myVIP.forEach(v=>{
    const daysRun = Math.min(Math.floor((Date.now()-v.startTime)/(1000*60*60*24)), v.duration);
    const fullProfit = v.dailyProfit* v.duration;
    const profitSoFar = v.dailyProfit*daysRun;
    withdrawable += profitSoFar;
    totalInvest += v.price;
    totalProfit += fullProfit;
    vipListEl.innerHTML += `
    <div class="bg-white p-3 rounded-xl shadow">
      <div class="font-bold">${v.name}</div>
      <div class="text-xs text-gray-500">Vốn: ${v.price.toLocaleString()}₫</div>
      <div class="text-xs text-green-600">Tổng lợi nhuận 80 ngày: ${fullProfit.toLocaleString()}₫</div>
      <div class="text-xs text-purple-600">Đã chạy: ${daysRun}/${v.duration} ngày</div>
    </div>`;
  });
  totalInvestEl.innerText = totalInvest.toLocaleString("vi-VN")+"₫";
  totalProfitEl.innerText = totalProfit.toLocaleString("vi-VN")+"₫";
  withdrawableEl.innerText = withdrawable.toLocaleString("vi-VN")+"₫";
}

// Lắng nghe Firebase VIP
onValue(vipHistoryRef, snap=>{
  vipHistory = [];
  snap.forEach(child=>{
    vipHistory.push(child.val());
  });
  renderVIP();
});

// ====== NAV ======
function goHome(){ window.location.href="home.html"; }
function goHoSo(){ window.location.href="hoso.html"; }
function goIntro(){ window.location.href="intro.html"; }
function goCuaToi(){ window.location.href="cuatoi.html"; }

window.goHome = goHome;
window.goHoSo = goHoSo;
window.goIntro = goIntro;
window.goCuaToi = goCuaToi;
</script>

</body>
</html>
