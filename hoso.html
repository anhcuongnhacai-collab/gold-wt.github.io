<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ của tôi</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background-color: #f3f4f6;
}

::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 10px;
}
</style>
</head>

<body class="h-screen flex justify-center">

<div class="w-full max-w-md bg-gray-50 h-full flex flex-col relative">

<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-10">
  <div class="py-3 text-center font-bold text-lg">
    Hồ sơ của tôi
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 overflow-y-auto pb-20 p-4 space-y-4">

<!-- BALANCE -->
<div class="bg-white rounded-2xl p-4 shadow">
  <div class="text-gray-500 text-sm">Tổng số dư</div>
  <div class="text-xl font-bold text-orange-500" id="balance2">0₫</div>
</div>

<!-- SUMMARY -->
<div class="grid grid-cols-2 gap-3">
  <div class="bg-white p-3 rounded-xl shadow">
    <div class="text-xs text-gray-500">Tổng vốn đã mua</div>
    <div class="font-bold" id="totalInvest">0₫</div>
  </div>

  <div class="bg-white p-3 rounded-xl shadow">
    <div class="text-xs text-gray-500">Có thể rút</div>
    <div class="font-bold text-blue-500" id="withdrawable">0₫</div>
  </div>

</div>

<div class="bg-white p-3 rounded-xl shadow">
  <div class="text-xs text-gray-500">Tổng lợi nhuận 80 ngày</div>
  <div class="font-bold text-green-600" id="totalProfit">0₫</div>
</div>

<!-- VIP LIST -->
<div class="space-y-3">
  <h2 class="font-bold">Gói VIP đã mua</h2>
  <div id="list"></div>
</div>

</main>

<!-- NAV -->
<nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-around py-2">
  <button class="flex flex-col items-center text-gray-400" onclick="goHome()">
    <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span class="text-[10px]">Trang chủ</span>
  </button>
  <button class="flex flex-col items-center text-black">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <span class="text-[10px] font-semibold">Hồ sơ</span>
  </button>

  <button class="flex flex-col items-center text-gray-400" onclick="goIntro()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    <span class="text-[10px]">Giới thiệu</span>
  </button>

  <button class="flex flex-col items-center text-gray-400" onclick="goCuaToi()">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px]">Của tôi</span>
  </button>

</nav>

</div>

<script>

/* ======================
   LOAD DATA
====================== */
let currentUser = JSON.parse(localStorage.getItem("currentUser"));
let users = JSON.parse(localStorage.getItem("users")) || [];
let vipHistory = JSON.parse(localStorage.getItem("vipHistory")) || [];

if(!currentUser){
  window.location.href = "login.html";
}

let user = users.find(u => u.phone == currentUser.phone);
if(!user){
  user = { phone: currentUser.phone, money: 0 };
  users.push(user);
}

/* ======================
   AUTO VIP (24H LOGIC)
====================== */
function runVIP(){

let now = Date.now();
let oneDay = 24 * 60 * 60 * 1000;

let myVIP = vipHistory.filter(v => v.phone == currentUser.phone);

let withdrawable = 0;

myVIP.forEach(v => {

  if(!v.lastClaim) v.lastClaim = v.startTime;

  let diff = now - v.lastClaim;

  if(diff >= oneDay){

    let days = Math.floor(diff / oneDay);

    let earn = v.dailyProfit * days;

    user.money += earn;
    withdrawable += earn;

    v.lastClaim += days * oneDay;
  }
});

localStorage.setItem("users", JSON.stringify(users));
localStorage.setItem("vipHistory", JSON.stringify(vipHistory));

document.getElementById("withdrawable").innerText =
  withdrawable.toLocaleString("vi-VN") + "₫";

document.getElementById("balance2").innerText =
  user.money.toLocaleString("vi-VN") + "₫";

}

/* ======================
   LOAD VIP LIST
====================== */
function loadVIP(){

let myVIP = vipHistory.filter(v => v.phone == currentUser.phone);

let html = "";
let totalInvest = 0;
let totalProfit = 0;

if(myVIP.length === 0){
  document.getElementById("list").innerHTML =
    `<div class="text-gray-400 text-sm">Chưa có gói VIP</div>`;
  return;
}

myVIP.forEach(v => {

let fullProfit = v.dailyProfit * 80;

totalInvest += v.price;
totalProfit += fullProfit;

let days = Math.floor((Date.now() - v.startTime) / (1000*60*60*24));
if(days > 80) days = 80;

html += `
<div class="bg-white p-3 rounded-xl shadow">

  <div class="font-bold">${v.name}</div>

  <div class="text-xs text-gray-500">
    Vốn: ${v.price.toLocaleString()}₫
  </div>

  <div class="text-xs text-green-600">
    Tổng lợi nhuận 80 ngày: ${fullProfit.toLocaleString()}₫
  </div>

  <div class="text-xs text-purple-600">
    Đã chạy: ${days}/80 ngày
  </div>

</div>
`;
});

document.getElementById("list").innerHTML = html;

document.getElementById("totalInvest").innerText =
  totalInvest.toLocaleString("vi-VN") + "₫";

document.getElementById("totalProfit").innerText =
  totalProfit.toLocaleString("vi-VN") + "₫";

}

/* ======================
   NAV
====================== */
function goHome(){ window.location.href="home.html"; }
function goIntro(){ window.location.href="intro.html"; }
function goCuaToi(){ window.location.href="cuatoi.html"; }

/* INIT */
runVIP();
loadVIP();

/* auto sync */
setInterval(runVIP, 60000);

</script>

</body>
</html>
