<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giới thiệu bạn bè</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
}

.container{
    width:360px;
    min-height:100vh;
    background:white;
    padding:20px;
}

.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.box{
    background:#f2f2f2;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.code{
    font-size:20px;
    font-weight:bold;
    color:#ff6a00;
    text-align:center;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#ff7a00,#ff3c78);
    color:white;
    font-size:16px;
    cursor:pointer;
}

.list{
    margin-top:15px;
}

.item{
    padding:10px;
    background:#eee;
    border-radius:10px;
    margin-bottom:8px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">Giới thiệu bạn bè</div>

    <!-- MÃ GIỚI THIỆU -->
    <div class="box">
        <p>Mã giới thiệu của bạn:</p>
        <div class="code" id="refCode">---</div>

        <button onclick="copyCode()">Sao chép mã</button>
    </div>

    <!-- DANH SÁCH BẠN ĐÃ MỜI -->
    <div class="box">
        <p>Danh sách bạn đã mời:</p>
        <div class="list" id="friendList">
            <div class="item">Chưa có người nào</div>
        </div>
    </div>

</div>

<script>

/* LOAD USER */
let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){
    alert("Vui lòng đăng nhập!");
    window.location.href = "index.html";
}

/* TẠO MÃ GIỚI THIỆU */
let refCode = currentUser.phone + Math.floor(Math.random()*1000);

document.getElementById("refCode").innerText = refCode;

/* COPY */
function copyCode(){
    navigator.clipboard.writeText(refCode);
    alert("Đã sao chép mã!");
}

/* DEMO DANH SÁCH BẠN BÈ */
let friends = JSON.parse(localStorage.getItem("friends_" + currentUser.phone)) || [];

let list = document.getElementById("friendList");
list.innerHTML = "";

if(friends.length === 0){
    list.innerHTML = "<div class='item'>Chưa có người nào</div>";
} else {
    friends.forEach(f => {
        list.innerHTML += `<div class="item">${f}</div>`;
    });
}

</script>

</body>
</html>
