<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: url("images/background.jpg") center/cover no-repeat;
}

    .container{

      width:420px;

      background:white;

      border-radius:25px;

      padding:40px 30px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.2);

    }

    /* LOGO */

    .logo{

      text-align:center;

      margin-bottom:30px;

    }

    .logo-img{

      width:100px;

      height:100px;

      border-radius:50%;

      object-fit:cover;

      margin-bottom:15px;

      box-shadow:
      0 5px 15px rgba(0,0,0,0.2);

    }

    .logo h1{

      font-size:38px;

      color:#ff4d6d;

    }

    .logo p{

      color:#777;

      margin-top:8px;

      font-size:15px;

    }

    /* INPUT */

    .input-box{

      width:100%;

      height:60px;

      background:#f4f4f4;

      border-radius:15px;

      margin-bottom:20px;

      display:flex;

      align-items:center;

      padding:0 15px;

    }

    .input-box i{

      color:#999;

      font-size:18px;

      margin-right:10px;

    }

    .input-box span{

      font-size:18px;

      color:#555;

      margin-right:5px;

    }

    .input-box input{

      width:100%;

      border:none;

      background:none;

      outline:none;

      font-size:17px;

    }

    /* CAPTCHA */

    .captcha-area{

      display:flex;

      gap:10px;

      margin-bottom:20px;

    }

    .captcha-input{

      flex:1;

      height:50px;

      border:none;

      outline:none;

      border-radius:12px;

      background:#f4f4f4;

      padding:0 15px;

      font-size:16px;

    }

    .captcha-box{

      width:110px;

      height:50px;

      background:#222;

      color:white;

      border-radius:12px;

      display:flex;

      justify-content:center;

      align-items:center;

      font-size:24px;

      font-weight:bold;

      letter-spacing:4px;

      cursor:pointer;

      user-select:none;

    }

    /* REMEMBER */

    .remember{

      display:flex;

      align-items:center;

      gap:10px;

      margin-bottom:20px;

      color:#666;

      font-size:15px;

    }

    /* LINKS */

    .links{

      display:flex;

      justify-content:space-between;

      margin-bottom:25px;

      font-size:15px;

    }

    .links a{

      text-decoration:none;

      color:#ff4d6d;

      font-weight:bold;

    }

    /* BUTTON */

    button{

      width:100%;

      height:60px;

      border:none;

      border-radius:15px;

      background:
      linear-gradient(
        135deg,
        #ff7b00,
        #ff3c78
      );

      color:white;

      font-size:20px;

      font-weight:bold;

      cursor:pointer;

      transition:0.3s;

    }

    button:hover{

      transform:scale(1.02);

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- LOGO -->

    <div class="logo">

      <img
      src="images/logo.png"
      class="logo-img">

      <h1>Đăng nhập</h1>

      <p>Chào mừng quay trở lại</p>

    </div>

    <!-- PHONE -->

    <div class="input-box">

      <i class="fa-solid fa-phone"></i>

      <span>+84</span>

      <input
      type="tel"
      id="loginPhone"
      placeholder="Nhập số điện thoại">

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

      <i class="fa-solid fa-lock"></i>

      <input
      type="password"
      id="loginPassword"
      placeholder="Nhập mật khẩu">

    </div>

    <!-- CAPTCHA -->

    <div class="captcha-area">

      <input
      type="text"
      id="captchaInput"
      class="captcha-input"
      placeholder="Mã xác nhận">

      <div
      class="captcha-box"
      id="captcha"
      onclick="createCaptcha()">
        1234
      </div>

    </div>

    <!-- REMEMBER -->

    <div class="remember">

      <input type="checkbox">

      <p>Ghi nhớ đăng nhập</p>

    </div>

    <!-- LINKS -->

    <div class="links">

      <a href="register.html">
        Đăng ký
      </a>

      <a href="#">
        Quên mật khẩu?
      </a>

    </div>

    <!-- BUTTON -->

    <button onclick="login()">
      Đăng nhập ngay
    </button>

  </div>

  <script>

    // RANDOM CAPTCHA

    let captchaCode = "";

    function createCaptcha(){

      captchaCode = Math.floor(
        1000 + Math.random() * 9000
      ).toString();

      document.getElementById("captcha")
      .innerText = captchaCode;

    }

    createCaptcha();

    // LOGIN

    function login(){

      let phone =
      document.getElementById("loginPhone")
      .value.trim();

      let password =
      document.getElementById("loginPassword")
      .value.trim();

      let captchaInput =
      document.getElementById("captchaInput")
      .value.trim();

      // CAPTCHA

      if(captchaInput !== captchaCode){

        alert("Sai mã xác nhận!");

        createCaptcha();

        return;

      }

      // USER

      let users = JSON.parse(localStorage.getItem("users")) || [];

let found = users.find(u => u.phone === phone && u.password === password);

if(!found){
  alert("Sai số điện thoại hoặc mật khẩu!");
  return;
}

// chỉ lưu dữ liệu cần thiết (TRÁNH LỖI + đồng bộ tốt hơn)
localStorage.setItem("currentUser", JSON.stringify({
  phone: found.phone
}));

alert("Đăng nhập thành công 🚀");
window.location.href = "home.html";

    }

  </script>

</body>
</html>
