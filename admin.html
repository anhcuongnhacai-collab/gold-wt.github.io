<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Quản lý giao dịch</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;}
body{ background:#f5f5f5; padding:20px;}
.container{ max-width:1400px; margin:auto;}
h1{ text-align:center; margin-bottom:20px; font-size:32px; font-weight:bold;}
.summary{ display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;}
.card{ flex:1; min-width:200px; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); text-align:center;}
.card h3{ font-size:14px; color:#666; margin-bottom:8px;}
.card .value{ font-size:28px; font-weight:bold;}
.table-wrapper{ overflow-x:auto; background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05);}
.table{ width:100%; border-collapse:collapse; min-width:1200px;}
.table th{ background:#111827; color:white; padding:14px; font-size:14px;}
.table td{ padding:12px; border-bottom:1px solid #eee; text-align:center; font-size:14px;}
.table tr:hover{ background:#f9fafb;}
.status{ padding:6px 12px; border-radius:999px; font-size:12px; font-weight:bold; display:inline-block;}
.pending{ background:#f59e0b; color:white;}
.success{ background:#10b981; color:white;}
.reject{ background:#ef4444; color:white;}
button{ border:none; border-radius:8px; padding:8px 12px; margin:2px; cursor:pointer; font-weight:bold;}
.approve{ background:#10b981; color:white;}
.cancel{ background:#ef4444; color:white;}
.disabled{ background:#d1d5db; color:#6b7280; cursor:not-allowed;}
.empty{ text-align:center; padding:30px; color:#888;}
</style>
</head>
<body>

<div class="container">
    <h1>ADMIN - QUẢN LÝ GIAO DỊCH</h1>
    <button onclick="logout()">Đăng xuất</button>

    <div class="summary">
        <div class="card">
            <h3>Tổng giao dịch</h3>
            <div class="value" id="totalCount">0</div>
        </div>
        <div class="card">
            <h3>Đang chờ</h3>
            <div class="value" id="pendingCount">0</div>
        </div>
        <div class="card">
            <h3>Thành công</h3>
            <div class="value" id="successCount">0</div>
        </div>
        <div class="card">
            <h3>Từ chối</h3>
            <div class="value" id="rejectCount">0</div>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table">
            <thead>
                <tr>
                    <th>SĐT</th>
                    <th>Tên tài khoản</th>
                    <th>Loại giao dịch</th>
                    <th>Số tiền</th>
                    <th>Ngân hàng</th>
                    <th>Chủ tài khoản</th>
                    <th>Số tài khoản</th>
                    <th>Thời gian</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { db, ref, onValue, set } from "./firebase-config.js";

let history = [];

// =========================
// KIỂM TRA ADMIN LOGIN
// =========================
if(localStorage.getItem("admin") !== "true") {
    window.location.href = "admin-login.html";
}

// =========================
// LẮNG NGHE NẠP TIỀN & RÚT TIỀN
// =========================
onValue(ref(db, "deposits"), snapshot => {
    history = history.filter(i => i.type !== "Nạp tiền");
    snapshot.forEach(child => {
        let item = child.val();
        item.key = child.key;
        history.push(item);
    });
    render();
});

onValue(ref(db, "withdraws"), snapshot => {
    history = history.filter(i => i.type !== "Rút tiền");
    snapshot.forEach(child => {
        let item = child.val();
        item.key = child.key;

        // LẤY USERNAME TỪ REGISTER
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let user = users.find(u => u.phone === item.phone);
        if(user) item.username = user.username; // Đồng bộ tên tài khoản
        else item.username = item.username || "-";

        history.push(item);
    });
    render();
});

// =========================
// FORMAT TIỀN
// =========================
function formatMoney(value){
    return Number(value||0).toLocaleString("vi-VN")+"₫";
}

// =========================
// CẬP NHẬT THỐNG KÊ
// =========================
function updateSummary(){
    document.getElementById("totalCount").innerText = history.length;
    document.getElementById("pendingCount").innerText = history.filter(i=>i.status==="pending").length;
    document.getElementById("successCount").innerText = history.filter(i=>i.status==="Thành công").length;
    document.getElementById("rejectCount").innerText = history.filter(i=>i.status==="Từ chối").length;
}

// =========================
// HIỂN THỊ DANH SÁCH
// =========================
function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    if(history.length===0){
        list.innerHTML = `<tr><td colspan="10" class="empty">Chưa có giao dịch nào</td></tr>`;
        updateSummary();
        return;
    }

    history.sort((a,b)=> (b.id||0)-(a.id||0)).forEach((item,index)=>{
        let statusText = item.status || "pending";
        let statusClass = statusText==="Thành công"?"success":statusText==="Từ chối"?"reject":"pending";

        let actionHtml = statusText==="pending"?`
            <button class="approve" onclick="approve(${index})">Duyệt</button>
            <button class="cancel" onclick="reject(${index})">Từ chối</button>
        `:`<button class="disabled" disabled>Đã xử lý</button>`;

        list.innerHTML += `
            <tr>
                <td>${item.phone||"-"}</td>
                <td>${item.username||"-"}</td>
                <td>${item.type||"-"}</td>
                <td>${formatMoney(item.amount)}</td>
                <td>${item.bank||"-"}</td>
                <td>${item.bankOwner||"-"}</td>
                <td>${item.bankNumber||"-"}</td>
                <td>${item.time||"-"}</td>
                <td><span class="status ${statusClass}">${statusText}</span></td>
                <td>${actionHtml}</td>
            </tr>
        `;
    });

    updateSummary();
}

// =========================
// DUYỆT & TỪ CHỐI GIAO DỊCH
// =========================
function approve(index){
    let item = history[index];
    if(!item || item.status!=="pending") return;

    if(item.type==="Nạp tiền"){
        let users = JSON.parse(localStorage.getItem("users"))||[];
        let userIndex = users.findIndex(u=>u.phone==item.phone);
        if(userIndex!==-1){
            users[userIndex].baseMoney = (users[userIndex].baseMoney || 10000) + Number(item.amount);
            localStorage.setItem("users",JSON.stringify(users));
        }
    }

    item.status="Thành công";

    if(item.key){
        set(ref(db, item.type==="Nạp tiền"?`deposits/${item.key}`:`withdraws/${item.key}`), item);
    }

    render();
    alert("✔ Duyệt thành công");
}

function reject(index){
    let item = history[index];
    if(!item || item.status!=="pending") return;

    if(item.type==="Rút tiền"){
        let users = JSON.parse(localStorage.getItem("users"))||[];
        let userIndex = users.findIndex(u=>u.phone==item.phone);
        if(userIndex!==-1){
            users[userIndex].baseMoney = (users[userIndex].baseMoney || 10000) + Number(item.amount);
            localStorage.setItem("users",JSON.stringify(users));
        }
    }

    item.status="Từ chối";
    if(item.key){
        set(ref(db, item.type==="Nạp tiền"?`deposits/${item.key}`:`withdraws/${item.key}`), item);
    }

    render();
    alert("❌ Đã từ chối giao dịch và hoàn tiền (nếu là rút tiền)");
}

// =========================
// LOGOUT
// =========================
function logout(){
    localStorage.removeItem("admin");
    window.location.href="admin-login.html";
}

// =========================
// GÁN RA WINDOW
// =========================
window.approve = approve;
window.reject = reject;
window.logout = logout;

// =========================
// KHỞI CHẠY
// =========================
render();

</script>

</body>
</html>
