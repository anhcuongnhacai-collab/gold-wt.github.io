<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tiền</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .payment-container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s;
        }

        .payment-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            margin-bottom: 25px;
            color: #ff0055;
            font-size: 28px;
        }

        .qr-code {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px auto;
            background-color: #f9f9f9;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #bbb;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .info {
            margin-bottom: 18px;
            text-align: left;
            font-size: 16px;
        }

        .info strong {
            display: inline-block;
            width: 150px;
            color: #555;
        }

        .momo-button {
            margin-top: 25px;
            display: inline-block;
            padding: 18px 30px;
            background: linear-gradient(135deg, #ff0055, #ff66aa);
            color: white;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255,0,85,0.4);
        }

        .momo-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,0,85,0.5);
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Nạp Tiền</h1>
        <div class="qr-code">
    <img src="images/momo.jpg" alt="QR Code" style="width: 100%; height: 100%; border-radius: 15px; object-fit: cover;">
</div>
        <div class="info"><strong>Số tài khoản:************</strong> </div>
        <div class="info"><strong>Tên chủ tài khoản:</strong> NGUYEN MANH CUONG </div>
        <div class="info"><strong>Số tiền:</strong> Nhập đúng số tiền bạn chọn</div>
        <div class="info"><strong>Nội dung CK:</strong> tên tài khoản đăng nhập của bạn</div>
        <a class="momo-button" href="https://me.momo.vn/nhantien1207" target="_blank">
            Mở MoMo để thanh toán
        </a>
    </div>
</body>
</html>
